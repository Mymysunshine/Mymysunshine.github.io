<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>多媒体示例</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>欢迎来到我们的校园</h1>
        <nav>
            <a href="index.html">首页</a> |
            <a href="about.html">关于我们</a> |
            <a href="multimedia.html">多媒体</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>校园标志</h2>
            <p>这是我们的校园标志：</p>
            <img src="images/logo.png" alt="校园标志" width="200" height="200">
        </section>

        <section>
            <h2>校歌</h2>
            <p>收听我们的校歌：</p>
            <audio controls>
                <source src="audio/school_anthem.mp3" type="audio/mpeg"></audio>
                您的浏览器不支持音频元素。

        </section>

        <section>
            <h2>校园参观</h2>
            <p>观看美丽校园的参观视频：</p>
            <video width="600" height="400" controls>
                <source src="video/campus_tour.mp4" type="video/mp4">
                您的浏览器不支持视频标签。
            </video>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 校园网站 保留所有权利。</p>
    </footer>
</body>
</html>
